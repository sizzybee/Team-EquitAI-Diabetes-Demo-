<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2040" viewBox="0 0 680 1020" font-family="Helvetica, Arial, sans-serif">
<title>Nine-stage decision tree for records labelled no diabetes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.q{fill:#F8F7F4;stroke:#B4B2A9;stroke-width:0.75}
.qd{fill:#F8F7F4;stroke:#888780;stroke-width:1;stroke-dasharray:5 4}
.th{font-size:14px;font-weight:bold;fill:#1F1E1D}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.co rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}.co .th{fill:#712B13}.co .ts{fill:#993C1D}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
</style></defs>
<rect width="680" height="1020" fill="#FFFFFF"/>

<rect class="q" x="60" y="30" width="240" height="44" rx="8"/>
<text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central">Record labelled "no diabetes"</text>
<line x1="180" y1="74" x2="180" y2="98" class="arr" marker-end="url(#arrow)"/>

<rect class="q" x="40" y="100" width="280" height="56" rx="8"/>
<text class="th" x="180" y="118" text-anchor="middle" dominant-baseline="central">0 · Out of scope?</text>
<text class="ts" x="180" y="138" text-anchor="middle" dominant-baseline="central">Pregnant, type 1 or under 18</text>
<rect class="q" x="40" y="184" width="280" height="56" rx="8"/>
<text class="th" x="180" y="202" text-anchor="middle" dominant-baseline="central">1 · Does the chart say diabetes?</text>
<text class="ts" x="180" y="222" text-anchor="middle" dominant-baseline="central">Chart or visit diagnosis</text>
<rect class="q" x="40" y="268" width="280" height="56" rx="8"/>
<text class="th" x="180" y="286" text-anchor="middle" dominant-baseline="central">2 · On a diabetes medicine?</text>
<text class="ts" x="180" y="306" text-anchor="middle" dominant-baseline="central">Insulin or diabetes pills</text>
<rect class="q" x="40" y="352" width="280" height="56" rx="8"/>
<text class="th" x="180" y="370" text-anchor="middle" dominant-baseline="central">3 · Any test in diabetes range?</text>
<text class="ts" x="180" y="390" text-anchor="middle" dominant-baseline="central">HbA1c ≥6.5%, FPG ≥126, 2-h ≥200</text>
<rect class="q" x="40" y="436" width="280" height="56" rx="8"/>
<text class="th" x="180" y="454" text-anchor="middle" dominant-baseline="central">4 · Any test in prediabetes range?</text>
<text class="ts" x="180" y="474" text-anchor="middle" dominant-baseline="central">5.7–6.4%, 100–125, 140–199</text>
<rect class="q" x="40" y="520" width="280" height="56" rx="8"/>
<text class="th" x="180" y="538" text-anchor="middle" dominant-baseline="central">5 · Did a normal test rule it out?</text>
<text class="ts" x="180" y="558" text-anchor="middle" dominant-baseline="central">Tested, all results normal</text>
<rect class="q" x="40" y="604" width="280" height="56" rx="8"/>
<text class="th" x="180" y="622" text-anchor="middle" dominant-baseline="central">6 · Diabetes damage or symptoms?</text>
<text class="ts" x="180" y="642" text-anchor="middle" dominant-baseline="central">Untested records only</text>
<rect class="q" x="40" y="688" width="280" height="56" rx="8"/>
<text class="th" x="180" y="706" text-anchor="middle" dominant-baseline="central">7 · Should they have been tested?</text>
<text class="ts" x="180" y="726" text-anchor="middle" dominant-baseline="central">Screening guideline applies</text>
<g class="te"><rect x="40" y="772" width="280" height="56" rx="8"/>
<text class="th" x="180" y="790" text-anchor="middle" dominant-baseline="central">HEALTHY_UNTESTED</text>
<text class="ts" x="180" y="810" text-anchor="middle" dominant-baseline="central">Keep, but count it less</text></g>

<line x1="180" y1="156" x2="180" y2="182" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="170" dominant-baseline="central">no</text>
<line x1="180" y1="240" x2="180" y2="266" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="254" dominant-baseline="central">no</text>
<line x1="180" y1="324" x2="180" y2="350" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="338" dominant-baseline="central">no</text>
<line x1="180" y1="408" x2="180" y2="434" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="422" dominant-baseline="central">no</text>
<line x1="180" y1="492" x2="180" y2="518" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="506" dominant-baseline="central">no</text>
<line x1="180" y1="576" x2="180" y2="602" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="590" dominant-baseline="central">untested</text>
<line x1="180" y1="660" x2="180" y2="686" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="674" dominant-baseline="central">no</text>
<line x1="180" y1="744" x2="180" y2="770" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="758" dominant-baseline="central">no</text>

<line x1="320" y1="128" x2="358" y2="128" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="116" text-anchor="middle">yes</text>
<line x1="320" y1="212" x2="358" y2="212" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="200" text-anchor="middle">yes</text>
<line x1="320" y1="296" x2="358" y2="296" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="284" text-anchor="middle">yes</text>
<line x1="320" y1="380" x2="358" y2="380" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="368" text-anchor="middle">yes</text>
<line x1="320" y1="464" x2="358" y2="464" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="452" text-anchor="middle">yes</text>
<line x1="320" y1="548" x2="358" y2="548" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="536" text-anchor="middle">yes</text>
<line x1="320" y1="632" x2="358" y2="632" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="620" text-anchor="middle">yes</text>
<line x1="320" y1="716" x2="358" y2="716" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="704" text-anchor="middle">yes</text>

<g class="pu"><rect x="360" y="100" width="280" height="56" rx="8"/>
<text class="th" x="500" y="118" text-anchor="middle" dominant-baseline="central">SET_ASIDE</text>
<text class="ts" x="500" y="138" text-anchor="middle" dominant-baseline="central">Outside what this card covers</text></g>
<g class="co"><rect x="360" y="184" width="280" height="56" rx="8"/>
<text class="th" x="500" y="202" text-anchor="middle" dominant-baseline="central">CONFIRMED</text>
<text class="ts" x="500" y="222" text-anchor="middle" dominant-baseline="central">REVIEW if not supported</text></g>
<g class="co"><rect x="360" y="268" width="280" height="56" rx="8"/>
<text class="th" x="500" y="286" text-anchor="middle" dominant-baseline="central">TREATED</text>
<text class="ts" x="500" y="306" text-anchor="middle" dominant-baseline="central">REVIEW if metformin, GLP-1, SGLT2</text></g>
<g class="co"><rect x="360" y="352" width="280" height="56" rx="8"/>
<text class="th" x="500" y="370" text-anchor="middle" dominant-baseline="central">LAB_CONFIRMED (2) / PROBABLE (1)</text>
<text class="ts" x="500" y="390" text-anchor="middle" dominant-baseline="central">Review: HbA1c-only high + low Hb</text></g>
<g class="pu"><rect x="360" y="436" width="280" height="56" rx="8"/>
<text class="th" x="500" y="454" text-anchor="middle" dominant-baseline="central">BORDERLINE</text>
<text class="ts" x="500" y="474" text-anchor="middle" dominant-baseline="central">+ FOLLOW_UP_MISSED if not rechecked</text></g>
<g class="te"><rect x="360" y="520" width="280" height="56" rx="8"/>
<text class="th" x="500" y="538" text-anchor="middle" dominant-baseline="central">RULED_OUT</text>
<text class="ts" x="500" y="558" text-anchor="middle" dominant-baseline="central">PARTLY_TESTED if fasting test only</text></g>
<g class="pu"><rect x="360" y="604" width="280" height="56" rx="8"/>
<text class="th" x="500" y="622" text-anchor="middle" dominant-baseline="central">UNKNOWN_HIGH</text>
<text class="ts" x="500" y="642" text-anchor="middle" dominant-baseline="central">Send to REVIEW</text></g>
<g class="pu"><rect x="360" y="688" width="280" height="56" rx="8"/>
<text class="th" x="500" y="706" text-anchor="middle" dominant-baseline="central">UNKNOWN (not healthy)</text>
<text class="ts" x="500" y="726" text-anchor="middle" dominant-baseline="central">Never train as healthy</text></g>

<line x1="40" y1="856" x2="640" y2="856" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="876" text-anchor="middle" dominant-baseline="central">Longitudinal data only: re-checks every record not labelled positive</text>

<rect class="qd" x="40" y="896" width="280" height="56" rx="8"/>
<text class="th" x="180" y="914" text-anchor="middle" dominant-baseline="central">8 · Do later visits show diabetes?</text>
<text class="ts" x="180" y="934" text-anchor="middle" dominant-baseline="central">Follows patients over time</text>
<line x1="320" y1="924" x2="358" y2="924" class="arr" marker-end="url(#arrow)"/><text class="ts" x="339" y="912" text-anchor="middle">yes</text>
<g class="co"><rect x="360" y="896" width="280" height="56" rx="8"/>
<text class="th" x="500" y="914" text-anchor="middle" dominant-baseline="central">LIKELY_PRESENT / DELAYED</text>
<text class="ts" x="500" y="934" text-anchor="middle" dominant-baseline="central">Diagnosis came later, or was missed</text></g>

<g class="co"><rect x="40" y="984" width="12" height="12" rx="2"/></g><text class="ts" x="60" y="990" dominant-baseline="central">Positive</text>
<g class="pu"><rect x="140" y="984" width="12" height="12" rx="2"/></g><text class="ts" x="160" y="990" dominant-baseline="central">Exclude, flag or review</text>
<g class="te"><rect x="340" y="984" width="12" height="12" rx="2"/></g><text class="ts" x="360" y="990" dominant-baseline="central">Negative</text>
</svg>
