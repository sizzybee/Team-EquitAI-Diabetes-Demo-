<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1440" viewBox="0 0 680 720" font-family="Helvetica, Arial, sans-serif">
<title>Label audit decision tree for records labelled no diabetes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.q{fill:#F8F7F4;stroke:#B4B2A9;stroke-width:0.75}
.th{font-size:14px;font-weight:bold;fill:#1F1E1D}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.co rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}.co .th{fill:#712B13}.co .ts{fill:#993C1D}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
</style></defs>
<rect width="680" height="720" fill="#FFFFFF"/>
<rect class="q" x="60" y="30" width="240" height="44" rx="8"/>
<text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central">Record labelled "no diabetes"</text>
<line x1="180" y1="74" x2="180" y2="98" class="arr" marker-end="url(#arrow)"/>

<rect class="q" x="40" y="100" width="280" height="56" rx="8"/>
<text class="th" x="180" y="118" text-anchor="middle" dominant-baseline="central">Pregnant when measured?</text>
<text class="ts" x="180" y="138" text-anchor="middle" dominant-baseline="central">At the time of the lab</text>
<rect class="q" x="40" y="184" width="280" height="56" rx="8"/>
<text class="th" x="180" y="202" text-anchor="middle" dominant-baseline="central">No glucose test on file?</text>
<text class="ts" x="180" y="222" text-anchor="middle" dominant-baseline="central">No HbA1c, fasting or 2-hour</text>
<rect class="q" x="40" y="268" width="280" height="56" rx="8"/>
<text class="th" x="180" y="286" text-anchor="middle" dominant-baseline="central">On insulin or diabetes pills?</text>
<text class="ts" x="180" y="306" text-anchor="middle" dominant-baseline="central">Current treatment</text>
<rect class="q" x="40" y="352" width="280" height="56" rx="8"/>
<text class="th" x="180" y="370" text-anchor="middle" dominant-baseline="central">Any result in diabetes range?</text>
<text class="ts" x="180" y="390" text-anchor="middle" dominant-baseline="central">HbA1c ≥6.5%, FPG ≥126, 2-h ≥200</text>
<rect class="q" x="40" y="436" width="280" height="56" rx="8"/>
<text class="th" x="180" y="454" text-anchor="middle" dominant-baseline="central">Any result in prediabetes range?</text>
<text class="ts" x="180" y="474" text-anchor="middle" dominant-baseline="central">5.7–6.4%, 100–125, 140–199</text>
<rect class="q" x="40" y="520" width="280" height="56" rx="8"/>
<text class="th" x="180" y="538" text-anchor="middle" dominant-baseline="central">Fasting glucose the only test?</text>
<text class="ts" x="180" y="558" text-anchor="middle" dominant-baseline="central">No HbA1c or 2-hour test</text>
<g class="te"><rect x="40" y="604" width="280" height="56" rx="8"/>
<text class="th" x="180" y="622" text-anchor="middle" dominant-baseline="central">HEALTHY</text>
<text class="ts" x="180" y="642" text-anchor="middle" dominant-baseline="central">Tested, normal results</text></g>

<line x1="180" y1="156" x2="180" y2="182" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="170" dominant-baseline="central">no</text>
<line x1="180" y1="240" x2="180" y2="266" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="254" dominant-baseline="central">no</text>
<line x1="180" y1="324" x2="180" y2="350" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="338" dominant-baseline="central">no</text>
<line x1="180" y1="408" x2="180" y2="434" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="422" dominant-baseline="central">no</text>
<line x1="180" y1="492" x2="180" y2="518" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="506" dominant-baseline="central">no</text>
<line x1="180" y1="576" x2="180" y2="602" class="arr" marker-end="url(#arrow)"/><text class="ts" x="190" y="590" dominant-baseline="central">no</text>

<line x1="320" y1="128" x2="378" y2="128" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="116" text-anchor="middle">yes</text>
<line x1="320" y1="212" x2="378" y2="212" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="200" text-anchor="middle">yes</text>
<line x1="320" y1="296" x2="378" y2="296" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="284" text-anchor="middle">yes</text>
<line x1="320" y1="380" x2="378" y2="380" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="368" text-anchor="middle">yes</text>
<line x1="320" y1="464" x2="378" y2="464" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="452" text-anchor="middle">yes</text>
<line x1="320" y1="548" x2="378" y2="548" class="arr" marker-end="url(#arrow)"/><text class="ts" x="349" y="536" text-anchor="middle">yes</text>

<g class="pu"><rect x="380" y="100" width="260" height="56" rx="8"/>
<text class="th" x="510" y="118" text-anchor="middle" dominant-baseline="central">SET_ASIDE</text>
<text class="ts" x="510" y="138" text-anchor="middle" dominant-baseline="central">Pregnancy shifts glucose readings</text></g>
<g class="pu"><rect x="380" y="184" width="260" height="56" rx="8"/>
<text class="th" x="510" y="202" text-anchor="middle" dominant-baseline="central">UNKNOWN (not healthy)</text>
<text class="ts" x="510" y="222" text-anchor="middle" dominant-baseline="central">High priority if risk factor</text></g>
<g class="co"><rect x="380" y="268" width="260" height="56" rx="8"/>
<text class="th" x="510" y="286" text-anchor="middle" dominant-baseline="central">DIABETES_TREATED</text>
<text class="ts" x="510" y="306" text-anchor="middle" dominant-baseline="central">Review: metformin only, woman &lt;45</text></g>
<g class="co"><rect x="380" y="352" width="260" height="56" rx="8"/>
<text class="th" x="510" y="370" text-anchor="middle" dominant-baseline="central">PROBABLE (1) / CONFIRMED (2)</text>
<text class="ts" x="510" y="390" text-anchor="middle" dominant-baseline="central">Review: HbA1c-only high + low Hb</text></g>
<g class="pu"><rect x="380" y="436" width="260" height="56" rx="8"/>
<text class="th" x="510" y="454" text-anchor="middle" dominant-baseline="central">BORDERLINE</text>
<text class="ts" x="510" y="474" text-anchor="middle" dominant-baseline="central">Not a clean negative</text></g>
<g class="pu"><rect x="380" y="520" width="260" height="56" rx="8"/>
<text class="th" x="510" y="538" text-anchor="middle" dominant-baseline="central">PARTLY_TESTED</text>
<text class="ts" x="510" y="558" text-anchor="middle" dominant-baseline="central">Fasting test misses post-meal highs</text></g>

<g class="co"><rect x="40" y="684" width="12" height="12" rx="2"/></g><text class="ts" x="60" y="690" dominant-baseline="central">Positive</text>
<g class="pu"><rect x="140" y="684" width="12" height="12" rx="2"/></g><text class="ts" x="160" y="690" dominant-baseline="central">Exclude, flag or down-weight</text>
<g class="te"><rect x="370" y="684" width="12" height="12" rx="2"/></g><text class="ts" x="390" y="690" dominant-baseline="central">Negative</text>
</svg>
